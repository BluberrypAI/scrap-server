name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: resource
          POSTGRES_PASSWORD: resource
          POSTGRES_DB: resource
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resource"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://resource:resource@localhost:5432/resource

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Agent docs in sync (.agents -> .claude)
        run: uv run python ../scripts/sync_agents.py --check

      - name: Migrations (upgrade, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Models match migrations
        run: uv run alembic check

      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://resource:resource@localhost:5432/resource
        run: uv run pytest -q
